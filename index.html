</style></head><body>
<div id="crystalisIntro" aria-label="Заставка CRYSTALIS"><canvas id="introCanvas"></canvas><div class="intro-text"><div class="intro-wordmark">CRYSTALIS</div><div class="intro-caption">ТВОЙ ЦИФРОВОЙ МИР</div></div><button class="intro-skip" id="skipIntro">Пропустить</button></div>

<script>
const BASE_KEY='crystalis_artworks_v1',BASE_CKEY='crystalis_collections_v1',BASE_LKEY='crystalis_learning_v1',BASE_MKEY='crystalis_mentor_history_v1';
const TOKEN_KEY='crystalis_auth_token_v1',USER_KEY='crystalis_auth_user_v1',LOCAL_USERS_KEY='crystalis_local_users_v1';
const CLIENT_VERSION='1.9.1'; // держи в одном значении с APP_VERSION на сервере (main.js и netlify/functions/api.js)
const COIN='Сойн'; // название внутренней валюты
let knownRev=null,coins=null;
let tab='Главная',chosenImage='',authMode='login',authMessage='';
let currentUser=(()=>{try{return JSON.parse(localStorage.getItem(USER_KEY)||'null')}catch(e){return null}})();

const scopedKey=base=>currentUser?`${base}_${currentUser.id}`:base;
const getKEY=()=>scopedKey(BASE_KEY);

function updateHeaderUser(){
 const btn=document.getElementById('headerAuthBtn');
 if(!btn)return;
 btn.textContent=currentUser?`✦ ${currentUser.name||currentUser.login}`:'◇ Войти';
 if(typeof setCoins==='function')setCoins(coins);

async function syncToServer(){
 if(!currentUser||!authToken)return;
 const payload={
  artworks:read(getKEY()),
  collections:read(getCKEY()),
  learning:learningData(),
  mentorHistory:(()=>{try{return JSON.parse(localStorage.getItem(getMKEY())||'[]')}catch(e){return []}})()
 };
 if(knownRev!==null)payload.rev=knownRev;
 try{
  const r=await fetch('/api/user/sync',{
   method:'POST',
   headers:{'Content-Type':'application/json','Authorization':'Bearer '+authToken},
   body:JSON.stringify(payload)
  });
  // Сервер отклонил устаревший список NFT (их меняла покупка/продажа) — подтягиваем свежие данные
  const d=await r.json().catch(()=>({}));if(d.stale&&typeof refreshAccount==='function')refreshAccount();
 }catch(e){}
 // Also update local fallback user store if used offline
 try{
  const lu=JSON.parse(localStorage.getItem(LOCAL_USERS_KEY)||'[]');
  const idx=lu.findIndex(u=>u.id===currentUser.id);
  if(idx!==-1){lu[idx].data=payload;localStorage.setItem(LOCAL_USERS_KEY,JSON.stringify(lu));}
 }catch(e){}
}

function applyAccountSession(user,token,data){
 currentUser=user;
 authToken=token||'';
 localStorage.setItem(USER_KEY,JSON.stringify(user));
 if(authToken)localStorage.setItem(TOKEN_KEY,authToken);
 if(data){
  if(Array.isArray(data.artworks))localStorage.setItem(getKEY(),JSON.stringify(data.artworks));
  if(Array.isArray(data.collections))localStorage.setItem(getCKEY(),JSON.stringify(data.collections));
  if(data.learning)localStorage.setItem(getLKEY(),JSON.stringify(data.learning));
  if(Array.isArray(data.mentorHistory))localStorage.setItem(getMKEY(),JSON.stringify(data.mentorHistory));
 }
 updateHeaderUser();
 if(typeof poll==='function')setTimeout(()=>poll(true),0);
}

function clearAccountSession(){
 currentUser=null;
 authToken='';knownRev=null;coins=null;notifs=[];

 localStorage.removeItem(TOKEN_KEY);
 updateHeaderUser();
}

{id:'crypto_hash',title:'Криптографическое хеширование и SHA-256',level:'Продвинутый',time:'9 минут',topic:'Криптография',text:'Криптографическая хеш-функция преобразует входные данные произвольной длины в строку фиксированного размера. Главные свойства: детерминированность, лавинный эффект (изменение даже 1 бита полностью меняет хеш) и стойкость к коллизиям.',example:'Если в документе изменить одну запятую, его SHA-256 хеш изменится полностью, что позволяет мгновенно выявить подмену метаданных NFT.',question:'Что произойдёт с SHA-256 хешем метаданных NFT, если изменить всего один символ в описании?',answers:['Изменится только последний символ хеша','Хеш изменится полностью и непредсказуемо (лавинный эффект)','Хеш останется прежним, если размер файла не изменился'],correct:1,why:'Точно! Лавинный эффект гарантирует, что малейшее изменение входных данных кардинально меняет итоговый дайджест.'},
{id:'smart_contracts',title:'Смарт-контракты и стандарты ERC-721 / ERC-1155',level:'Продвинутый',time:'10 минут',topic:'Смарт-контракты',text:'Смарт-контракт — детерминированный код в блокчейне, исполняемый виртуальной машиной (например, EVM). Стандарт ERC-721 описывает уникальные невзаимозаменяемые токены, где каждый tokenId уникален, а ERC-1155 позволяет хранить в одном контракте как уникальные, так и полувзаимозаменяемые токены.',example:'В игровых экосистемах ERC-1155 часто используют для предметов, где у одного меча может быть 100 копий, а легендарный артефакт существует в единственном экземпляре.',question:'В чём ключевое архитектурное отличие стандарта ERC-1155 от ERC-721?',answers:['ERC-1155 не поддерживает передачу токенов между кошельками','ERC-1155 позволяет управлять множеством типов токенов в одном контракте','ERC-721 работает только без смарт-контрактoв'],correct:1,why:'Верно! ERC-1155 оптимизирует газ и позволяет объединять разные классы активов в едином смарт-контракте.'},

function openLesson(id){
 const l=courseLessons.find(x=>x.id===id);if(!l)return;activeLesson=id;chosenAnswer=null;quizFeedback='';
 const d=learningData(),done=d.done.includes(id);
 shell(l.title,`${l.topic} · ${l.time} · ${l.level}`,`
 <button class="btn ghost" id="backLessons">← Все уроки</button>
 <div class="panel"><img class="lesson-art" src="images/${({nft:'nft',chain:'blockchain',wallet:'wallet',mint:'nft',fees:'verification',rights:'learning'}[l.id]||'learning')}.svg" alt="Иллюстрация к уроку"><span class="pill">УРОК</span><p class="muted" style="font-size:14px">${l.text}</p><div class="notice"><strong>Пример из жизни</strong><br>${l.example}</div></div>
 <div class="panel"><h3>Проверь себя</h3><p>${l.question}</p><div id="quizOptions">${l.answers.map((a,i)=>`<button class="card quiz-option" data-answer="${i}" style="margin-bottom:8px">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}</div><div id="quizFeedback"></div><button class="btn" id="checkAnswer">Проверить ответ</button></div>
 <div class="panel"><div class="mentor-head"><div class="mentor-avatar">✦</div><div><strong>Нужна помощь?</strong><p class="muted" style="margin:4px 0 0">Наставник объяснит тему этого урока</p></div></div><button class="btn secondary" id="askLessonMentor">Спросить наставника об этом уроке</button></div>
 ${done?'<div class="notice">Этот урок уже завершён. Ты можешь повторить тест, но опыт повторно не начисляется.</div>':''}
 `);
 document.getElementById('backLessons').onclick=()=>{activeLesson=null;learn()};
 const askMentor=document.getElementById('askLessonMentor');if(askMentor)askMentor.onclick=()=>go('Наставник');
 document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{chosenAnswer=Number(b.dataset.answer);document.querySelectorAll('[data-answer]').forEach(x=>x.style.borderColor='');b.style.borderColor='var(--purple)'});
 document.getElementById('checkAnswer').onclick=()=>{
  if(chosenAnswer===null){alert('Сначала выбери вариант ответа.');return}
  const good=chosenAnswer===l.correct,fb=document.getElementById('quizFeedback');
  if(good){let data=learningData();if(!data.done.includes(id)){data.done.push(id);data.xp+=20;saveLearning(data)}fb.innerHTML=`<div class="notice" style="border-color:#36B37E"><strong>Верно! +${d.done.includes(id)?0:20} опыта</strong><br>${l.why}</div><button class="btn" id="continueLearning">Продолжить обучение</button>`;document.getElementById('checkAnswer').disabled=true;document.getElementById('checkAnswer').style.opacity='.5';document.getElementById('continueLearning').onclick=()=>{activeLesson=null;learn()}}
  else fb.innerHTML=`<div class="notice"><strong>Пока неверно. Попробуй ещё раз.</strong><br>Подумай над материалом урока и выбери другой ответ.</div>`;
 };
}

function mentorReply(question, lessonId){
 const q=question.toLowerCase();
 const l=courseLessons.find(x=>x.id===lessonId);
 if(/привет|здравствуй|добрый день/.test(q)) return 'Привет! Я Наставник CRYSTALIS. Могу объяснить тему урока, разобрать термин или помочь подготовиться к тесту. С чего начнём?';
 if(/что такое nft|нфт/.test(q)) return 'NFT — невзаимозаменяемый токен: уникальная запись в блокчейне. Важно различать токен и файл изображения. Сам факт владения NFT не всегда передаёт авторские права на изображение.';
 if(/блокчейн/.test(q)) return 'Блокчейн — распределённый реестр. Записи объединяются в блоки и связываются криптографическими методами. Участники сети проверяют новые операции по правилам конкретной сети.';
 if(/кошел[её]к|ключ|seed|секретн/.test(q)) return 'Криптокошелёк помогает управлять ключами и взаимодействовать с блокчейном. Публичный адрес можно сообщать для получения активов. Закрытый ключ и секретную фразу восстановления никому не передавай — даже человеку, который представляется поддержкой.';
 if(/mint|выпуск/.test(q)) return 'Mint — это выпуск токена в блокчейне. Сохранить изображение в телефоне или создать макет в CRYSTALIS — ещё не значит выпустить NFT. Для настоящего выпуска нужна отдельная операция в блокчейн-сети.';
 if(/комисс|транзакц/.test(q)) return 'Транзакция — операция, отправляемая в сеть. В некоторых сетях за её обработку взимается комиссия. Она зависит от правил сети, типа операции и текущей нагрузки. Перед подтверждением проверяй адрес, сеть и сумму.';
 if(/авторск|прав[ао]|лиценз/.test(q)) return 'Покупка NFT сама по себе не означает автоматическую передачу авторских прав. Права на использование изображения определяются условиями лицензии, договора и применимым законодательством.';
 if(/ошиб|не понял|непонят|объясни проще|проще/.test(q) && l) return 'Давай проще разберём урок «'+l.title+'». '+l.example+'\n\nГлавная мысль: '+l.why;
 if(l) return 'Сейчас открыт урок «'+l.title+'». '+l.text+'\n\nПример: '+l.example+'\n\nМожешь спросить меня о NFT, блокчейне, кошельках, выпуске токенов, комиссиях или авторских правах.';
 return 'Я пока работаю как встроенный учебный помощник с подготовленными объяснениями, а не как подключённая облачная нейросеть. Могу помочь с темами NFT, блокчейна, криптокошельков, Mint, комиссий и авторских прав. Сформулируй вопрос по одной из этих тем.';
}

 const status=document.getElementById('mentorStatus');

 const send=async(text)=>{const input=document.getElementById('mentorQuestion'),q=(text||input.value).trim();if(!q)return;const btn=document.getElementById('sendMentor');btn.disabled=true;btn.textContent='Думаю…';input.disabled=true;let h=[];try{h=JSON.parse(localStorage.getItem(getMKEY())||'[]')}catch(e){};h.push({role:'user',text:q});const box=document.getElementById('mentorChat');box.innerHTML=h.map(m=>`<div class="chat-msg ${m.role==='user'?'user':'bot'}">${esc(m.text)}</div>`).join('')+'<div class="chat-msg bot" id="mentorThinking">Наставник обдумывает вопрос…</div>';input.value='';box.scrollTop=box.scrollHeight;

function fmtSeen(ts){
 if(!ts)return 'был(а) давно';
 const d=new Date(ts),now=new Date(),diff=(now-d)/1000;
 if(diff<60)return 'был(а) только что';
 if(diff<3600)return 'был(а) '+Math.floor(diff/60)+' мин. назад';
 const hm=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
 if(d.toDateString()===now.toDateString())return 'был(а) сегодня в '+hm;
 if(d.toDateString()===new Date(now-864e5).toDateString())return 'был(а) вчера в '+hm;
 return 'был(а) '+d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})+' в '+hm;
}

const TICK_CLOCK='<svg viewBox="0 0 17 12"><circle cx="8.5" cy="6" r="4.6"/><path d="M8.5 3.6V6l1.6 1"/></svg>';
const TICK_ONE='<svg viewBox="0 0 17 12"><path d="M3.5 6.4l3 3 7-7.4"/></svg>';
const TICK_TWO='<svg viewBox="0 0 17 12"><path d="M1.5 6.4l3 3 6.6-7"/><path d="M7.4 8.6l1 .9 7-7.4"/></svg>';

 <h2 class="eyebrow">ДРУЗЬЯ</h2><div class="panel" id="friendsBox"><p class="muted">Загрузка…</p></div>

const chatImgCache=new Map();
function prepChatImage(file){return new Promise((ok,no)=>{
 if(!file||!file.type.startsWith('image/'))return no(new Error('Выбери файл изображения.'));
 if(file.size>20*1024*1024)return no(new Error('Файл слишком большой (до 20 МБ).'));
 const r=new FileReader();r.onerror=()=>no(new Error('Не удалось прочитать файл.'));
 r.onload=()=>{const im=new Image();im.onerror=()=>no(new Error('Не удалось открыть изображение.'));
  im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k));
   const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
   let q=.82,d=c.toDataURL('image/jpeg',q);while(d.length>380000&&q>.4){q-=.1;d=c.toDataURL('image/jpeg',q)}
   d.length>380000?no(new Error('Картинка слишком тяжёлая, выбери другую.')):ok(d)};
  im.src=r.result};r.readAsDataURL(file)})}
function openLightbox(src){const d=document.createElement('div');d.className='lightbox';d.innerHTML='<img alt="">';d.firstChild.src=src;d.onclick=()=>d.remove();document.body.appendChild(d)}
async function hydrateChatImg(el){const id=el.dataset.cimg;
 try{let s=chatImgCache.get(id);if(!s){s=(await api('/chat/image/'+encodeURIComponent(id))).image;chatImgCache.set(id,s)}el.src=s}catch(e){el.alt='Картинка недоступна'}}
function chatRoom(){
 const isGlobal=chatView.t==='global',base=isGlobal?'/chat/global':'/dm/'+encodeURIComponent(chatView.login);
 shell(isGlobal?'Общий чат':esc(chatView.name||chatView.login),isGlobal?'Сообщения видят все участники.':'Личная переписка · @'+esc(chatView.login),`
 <div class="row"><button class="btn ghost" id="chatBack">← Все чаты</button>${isGlobal?'':`<button class="btn secondary" id="chatFriend">＋ В друзья</button><button class="btn secondary" data-prof="${esc(chatView.login)}">Профиль</button>`}</div>
 ${isGlobal?'':'<div class="chat-pres" id="chatPres"></div>'}<div class="chat-room" id="chatLog"><p class="muted">Загрузка…</p></div>
 <div class="chat-prev hide" id="chatPrev"><img alt=""><span>Картинка прикреплена</span><button id="chatPrevX" aria-label="Убрать картинку">✕</button></div>
 <div class="chat-input"><button class="btn secondary attach" id="chatAttach" title="Прикрепить картинку" aria-label="Прикрепить картинку">📎</button><textarea id="chatText" placeholder="Напиши сообщение…" maxlength="1000"></textarea><button class="btn" id="chatSend">Отправить</button></div><input type="file" id="chatFile" accept="image/*" class="hide">`);
 let pending='';
 const log=document.getElementById('chatLog'),mine=currentUser.login.toLowerCase();
 const draw=msgs=>{
  const sig=msgs.length+':'+(msgs.length?msgs[msgs.length-1].id:'')+':'+msgs.reduce((n,m)=>n+(m.delivered?1:0)+(m.read?2:0),0);
  if(sig===chatSig)return;chatSig=sig;
  const stick=log.scrollHeight-log.scrollTop-log.clientHeight<80;
  log.innerHTML=msgs.length?msgs.map(m=>{const me=m.from.toLowerCase()===mine;return `<div class="chat-msg ${me?'user':'bot'}">${isGlobal&&!me?`<span class="who" data-prof="${esc(m.from)}">${esc(m.name)}</span>`:''}${m.img?`<img class="chat-img" data-cimg="${esc(m.id)}" alt="Картинка"${chatImgCache.get(m.id)?` src="${chatImgCache.get(m.id)}"`:''}>`:''}${esc(m.text)}<span class="when">${new Date(m.at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}${me&&!isGlobal?tickHtml(m):''}</span></div>`}).join(''):'<p class="muted">Пока тишина. Напиши первое сообщение!</p>';
  log.querySelectorAll('[data-cimg]').forEach(el=>{el.onclick=()=>el.src&&openLightbox(el.src);if(!el.getAttribute('src'))hydrateChatImg(el).then(()=>{if(stick)log.scrollTop=log.scrollHeight})});
  if(stick||msgs.length<=1)log.scrollTop=log.scrollHeight;
 };
 const load=async()=>{if(!document.getElementById('chatLog')||tab!=='Чаты')return stopChat();try{const d=await api(base);draw(d.messages);const pe=document.getElementById('chatPres');if(pe&&d.peer)pe.innerHTML=presHtml(d.peer)}catch(e){log.innerHTML='<div class="auth-error">'+esc(e.message)+'</div>';chatSig='';stopChat()}};
 const showPrev=()=>{const p=document.getElementById('chatPrev');p.classList.toggle('hide',!pending);if(pending)p.querySelector('img').src=pending};
 const attach=async f=>{try{pending=await prepChatImage(f);showPrev()}catch(e){alert(e.message)}};
 const send=async()=>{const ta=document.getElementById('chatText'),text=ta.value.trim();if(!text&&!pending)return;const btn=document.getElementById('chatSend');btn.disabled=true;try{const sent=await api(base,pending?{text,image:pending}:{text});if(pending&&sent.message)chatImgCache.set(sent.message.id,pending);pending='';showPrev();ta.value='';await load();log.scrollTop=log.scrollHeight}catch(e){alert(e.message)}finally{btn.disabled=false;ta.focus()}};
 document.getElementById('chatBack').onclick=()=>openChat({t:'list'});
 const fr=document.getElementById('chatFriend');if(fr)fr.onclick=async()=>{try{await api('/friends/add',{login:chatView.login});fr.textContent='В друзьях ✓';fr.disabled=true}catch(e){alert(e.message)}};
 document.getElementById('chatSend').onclick=send;

 document.getElementById('chatText').onpaste=e=>{const f=[...(e.clipboardData&&e.clipboardData.files||[])].find(x=>x.type.startsWith('image/'));if(f){e.preventDefault();attach(f)}};
 let lastTyping=0;
 document.getElementById('chatText').oninput=e=>{if(isGlobal||!e.target.value.trim()||Date.now()-lastTyping<2500)return;lastTyping=Date.now();api(base+'/typing',{}).catch(()=>{})};
 document.getElementById('chatText').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
 if(!isGlobal)api('/notifications/read',{key:'dm:'+chatView.login.toLowerCase()}).catch(()=>{});
 load();chatTimer=setInterval(load,3000);
}

let notifs=[],lastUnread=0,notifsLoaded=false,mktSel='',mktSig='',profLogin='',profBack='Главная',polling=false,thumbBusy=false,toastT=null;

/* Миниатюра для рынка и профилей: большие картинки по сети не гоняем */
function makeThumb(src){return new Promise(res=>{const i=new Image();i.onload=()=>{try{const s=Math.min(1,480/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(i.width*s));c.height=Math.max(1,Math.round(i.height*s));const x=c.getContext('2d');x.fillStyle='#11121D';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.72))}catch(e){res('')}};i.onerror=()=>res('');i.src=src})}
async function backfillThumbs(){
 if(thumbBusy||!serverAccount())return;
 const need=read(getKEY()).filter(x=>x.image&&x.thumb===undefined);if(!need.length)return;
 thumbBusy=true;
 try{const m=new Map();for(const x of need)m.set(x.id,await makeThumb(x.image));
  const fresh=read(getKEY());fresh.forEach(x=>{if(x.thumb===undefined&&m.has(x.id))x.thumb=m.get(x.id)});
  localStorage.setItem(getKEY(),JSON.stringify(fresh));syncToServer();
 }finally{thumbBusy=false}
}

 if(was){

async function poll(force){

function startCrystalisJump(){
 stopGameLoop();
 const box=document.getElementById('gameContainer');
 box.innerHTML=`
  <div style="display:flex;justify-content:space-between;align-items:center">
   <strong>🚀 Crystalis Jump</strong>
   <span class="pill" id="jumpScorePill">Счёт: 0</span>
  </div>
  <p class="muted" style="font-size:12px">Управляй стрелками ◀ ▶ или нажимай на левую/правую половину экрана. Прыгай по платформам и собирай кристаллы!</p>
  <canvas id="jumpCanvas" class="game-canvas" width="340" height="460"></canvas>
  <button class="btn ghost" id="jumpRestart">Начать заново</button>
 `;
 const cv=document.getElementById('jumpCanvas'),ctx=cv.getContext('2d');
 let player={x:155,y:380,w:28,h:28,vx:0,vy:-10};
 let plats=[],score=0,alive=true,keys={left:false,right:false};
 for(let i=0;i<8;i++)plats.push({x:Math.random()*270,y:440-i*62,w:68,h:12,gem:i%2===1});
 plats[0]={x:135,y:430,w:75,h:12,gem:false};

 const onKey=(e,st)=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=st;if(e.key==='ArrowRight'||e.key==='d')keys.right=st};
 window.onkeydown=e=>onKey(e,true);window.onkeyup=e=>onKey(e,false);
 cv.onpointerdown=e=>{const r=cv.getBoundingClientRect();if(e.clientX-r.left<r.width/2)keys.left=true;else keys.right=true};
 cv.onpointerup=()=>{keys.left=false;keys.right=false};

 async function endJump(){
  alive=false;
  const reward=Math.min(25,Math.floor(score/150));
  ctx.fillStyle='rgba(13,14,23,0.85)';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#fff';ctx.font='bold 22px sans-serif';ctx.textAlign='center';
  ctx.fillText('Игра окончена!',170,190);
  ctx.font='16px sans-serif';ctx.fillStyle='#B99AFF';
  ctx.fillText('Счёт: '+score+' · Награда: +'+reward+' '+COIN,170,225);
  if(serverAccount()&&(reward>0||score>0)){
   try{const d=await api('/game/reward',{coins:reward,score,level:0});setCoins(d.coins);currentUser.gameStats=d.gameStats;localStorage.setItem(USER_KEY,JSON.stringify(currentUser))}catch(e){}
  }
 }

 function loop(){
  if(!alive||!document.getElementById('jumpCanvas'))return;
  ctx.clearRect(0,0,cv.width,cv.height);
  if(keys.left)player.vx=-4.5;else if(keys.right)player.vx=4.5;else player.vx*=0.82;
  player.x+=player.vx;
  if(player.x<-14)player.x=cv.width-14;if(player.x>cv.width-14)player.x=-14;
  player.vy+=0.34;player.y+=player.vy;

  if(player.y<200){
   const dy=200-player.y;player.y=200;score+=Math.floor(dy);
   document.getElementById('jumpScorePill').textContent='Счёт: '+score;
   plats.forEach(p=>{p.y+=dy;if(p.y>cv.height){p.y=0;p.x=Math.random()*270;p.gem=Math.random()<0.4}});
  }
  plats.forEach(p=>{
   ctx.fillStyle='#8B5CF6';ctx.fillRect(p.x,p.y,p.w,p.h);
   if(p.gem){ctx.fillStyle='#F5D06B';ctx.beginPath();ctx.arc(p.x+p.w/2,p.y-10,6,0,Math.PI*2);ctx.fill();}
   if(player.vy>0&&player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>=p.y&&player.y+player.h<=p.y+p.h+10){
    player.vy=-10.5;
    if(p.gem){p.gem=false;score+=50;document.getElementById('jumpScorePill').textContent='Счёт: '+score}
   }
  });
  ctx.fillStyle='#E9D5FF';ctx.beginPath();ctx.moveTo(player.x+14,player.y);ctx.lineTo(player.x+28,player.y+14);ctx.lineTo(player.x+14,player.y+28);ctx.lineTo(player.x,player.y+14);ctx.closePath();ctx.fill();
  if(player.y>cv.height)return endJump();
  gameLoopId=requestAnimationFrame(loop);
 }
 document.getElementById('jumpRestart').onclick=startCrystalisJump;
 loop();
}

function startCrystalLevels(){
 stopGameLoop();
 const gs=(currentUser&&currentUser.gameStats)||{levelsCleared:0};
 let lvl=(gs.levelsCleared||0)+1;
 const box=document.getElementById('gameContainer');
 const target=lvl*5;
 let collected=0,timeLeft=15+lvl*2;
 box.innerHTML=`
  <div style="display:flex;justify-content:space-between;align-items:center">
   <strong>💎 Уровень ${lvl}</strong>
   <span class="pill" id="lvlStatus">Собрано: 0 / ${target} · ${timeLeft}с</span>
  </div>
  <p class="muted" style="font-size:12px">Нажимай на появляющиеся кристаллы до истечения таймера! Награда за уровень: +${Math.min(30,lvl*5)} ${COIN}.</p>
  <div id="lvlArena" style="position:relative;height:280px;background:#11121D;border:1px solid var(--purple);border-radius:14px;overflow:hidden;margin:10px 0"></div>
 `;
 const arena=document.getElementById('lvlArena');
 function spawnGem(){
  if(!document.getElementById('lvlArena'))return;
  arena.innerHTML='';
  const g=document.createElement('button');
  g.textContent='◈';
  g.style.cssText=`position:absolute;left:${10+Math.random()*75}%;top:${10+Math.random()*70}%;font-size:28px;background:#2A2340;border:2px solid #B99AFF;color:#F5D06B;border-radius:50%;width:48px;height:48px`;
  g.onclick=async()=>{
   collected++;
   document.getElementById('lvlStatus').textContent=`Собрано: ${collected} / ${target} · ${timeLeft}с`;
   if(collected>=target){
    clearInterval(tInt);
    const reward=Math.min(30,lvl*5);
    arena.innerHTML=`<div style="padding:40px 15px;text-align:center"><h3>🎉 Уровень ${lvl} пройден!</h3><p class="muted">Награда: +${reward} ${COIN}</p><button class="btn" id="nextLvlBtn">Следующий уровень</button></div>`;
    if(serverAccount()){
     try{const d=await api('/game/reward',{coins:reward,score:0,level:lvl});setCoins(d.coins);currentUser.gameStats=d.gameStats;localStorage.setItem(USER_KEY,JSON.stringify(currentUser))}catch(e){}
    }
    document.getElementById('nextLvlBtn').onclick=startCrystalLevels;
   }else spawnGem();
  };
  arena.appendChild(g);
 }
 spawnGem();
 const tInt=setInterval(()=>{
  if(!document.getElementById('lvlArena'))return clearInterval(tInt);
  timeLeft--;
  document.getElementById('lvlStatus').textContent=`Собрано: ${collected} / ${target} · ${timeLeft}с`;
  if(timeLeft<=0){
   clearInterval(tInt);
   arena.innerHTML=`<div style="padding:40px 15px;text-align:center"><h3>⏰ Время вышло!</h3><button class="btn" id="retryLvlBtn">Попробовать снова</button></div>`;
   document.getElementById('retryLvlBtn').onclick=startCrystalLevels;
  }
 },1000);
}

function achievementsPage(){
 const works=read(getKEY()).length;
 const cols=read(getCKEY()).length;
 const doneLessons=learningData().done.length;
 const gs=(currentUser&&currentUser.gameStats)||{jumpBest:0,levelsCleared:0,coinsEarned:0};
 const bal=coins||0;

 const tracks=[
  {title:'Цифровой творец',desc:'Создавай NFT-работы в своей галерее',val:works,steps:[1,3,5,10,20]},
  {title:'Куратор коллекций',desc:'Объединяй работы в тематические коллекции',val:cols,steps:[1,2,4,7,10]},
  {title:'Магистр Академии',desc:'Проходи сложные уроки по блокчейну и криптографии',val:doneLessons,steps:[1,3,5,7,9]},
  {title:'Покоритель вершин (Jump)',desc:'Набирай очки в игре Crystalis Jump',val:gs.jumpBest||0,steps:[200,600,1200,2500,5000]},
  {title:'Искатель кристаллов (Уровни)',desc:'Проходи уровни в Кристальном лабиринте',val:gs.levelsCleared||0,steps:[1,3,5,10,15]},
  {title:'Магнат Сойн',desc:'Накопи капитал внутренней валюты Сойн',val:bal,steps:[150,300,600,1200,2500]}
 ];

 shell('Достижения CRYSTALIS','Каждое достижение имеет 5 уровней прогресса.',tracks.map(tr=>{
  let stage=0;tr.steps.forEach(s=>{if(tr.val>=s)stage++});
  const next=tr.steps[Math.min(4,stage)];
  const pct=Math.min(100,Math.round((tr.val/next)*100));
  return `<div class="ach-card">
   <div style="display:flex;justify-content:space-between;align-items:center">
    <strong>${esc(tr.title)}</strong>
    <span class="ach-tier">Этап ${stage} / 5</span>
   </div>
   <p class="muted" style="margin:6px 0">${esc(tr.desc)} (Текущий прогресс: ${tr.val} / ${next})</p>
   <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
   <div>${tr.steps.map((s,idx)=>`<span class="pill" style="${tr.val>=s?'background:#4C1D95;color:#fff':''}">${idx+1} ур: ${s}</span>`).join('')}</div>
  </div>`;
 }).join(''));
}

function render(){stopChat();stopGameLoop();const pages={'Игры':gamesPage,'Достижения':achievementsPage,'Рынок':bazaar,'Игрок':playerPage,'Чаты':chats,'Главная':home,'Создать':creator,'Галерея':gallery,'Коллекции':collections,'Студия ИИ':ai,'Обучение':learn,'Наставник':mentor,'Блокчейн':blockchain,'Витрина':market,'Профиль':profile,'Разработчик':devPanel};(pages[tab]||home)();const items=[['Главная','Главная'],['Создать','Создать'],['Галерея','Галерея'],['Рынок','Рынок'],['Игры','Игры'],['Достижения','Достижения'],['Обучение','Обучение'],['Наставник','Наставник'],['Чаты','Чаты'],['Профиль','Профиль']];if(currentUser&&currentUser.role==='developer')items.push(['Разработчик','Админ']);document.getElementById('nav').innerHTML=items.map(([k,v])=>`<button class="${tab===k?'active':''}" data-tab="${k}">${navIcon(k)}<span class="nl">${v}</span></button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab))}
updateHeaderUser();
render();
if(authToken&&!authToken.startsWith('local_token_')){
 fetch('/api/auth/me',{headers:{'Authorization':'Bearer '+authToken}})
  .then(r=>r.ok?r.json():Promise.reject())
  .then(d=>{applyAccountSession(d.user,authToken,d.data);render();})
  .catch(()=>{clearAccountSession();render();});
}

(function startCrystalisIntro(){
const intro=document.getElementById('crystalisIntro');if(!intro)return;
const cv=document.getElementById('introCanvas');if(!cv)return;
const ctx=cv.getContext('2d');
let raf=0,done=false,W=0,H=0,dpr=1,S=1,cx=0,cy=0;
const finish=()=>{if(done)return;done=true;cancelAnimationFrame(raf);window.removeEventListener('resize',resize);intro.classList.add('out');setTimeout(()=>intro.remove(),850);};
const skip=document.getElementById('skipIntro');if(skip)skip.addEventListener('click',finish,{once:true});

let seed=23;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const easeIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;

/* ---- Кристалл: двусторонний гексагональный, в координатах -112…112 ---- */
const TOP=[0,-112],BOT=[0,112],XS=[-44,-15,15,44],YT=-50,YB=50;
const facets=[];
for(let i=0;i<3;i++){
  const base=[38,50,62][i];
  facets.push({p:[TOP,[XS[i],YT],[XS[i+1],YT]],l:base+8});
  facets.push({p:[[XS[i],YT],[XS[i+1],YT],[XS[i],YB]],l:base+3});
  facets.push({p:[[XS[i+1],YT],[XS[i+1],YB],[XS[i],YB]],l:base-3});
  facets.push({p:[[XS[i],YB],[XS[i+1],YB],BOT],l:base-9});
}
const N=3,shards=[];
facets.forEach(f=>{
  const [A,B,C]=f.p;
  const P=(i,j)=>[A[0]+(B[0]-A[0])*i/N+(C[0]-A[0])*j/N,A[1]+(B[1]-A[1])*i/N+(C[1]-A[1])*j/N];
  const add=(a,b,c)=>{
    const tx=(a[0]+b[0]+c[0])/3,ty=(a[1]+b[1]+c[1])/3;
    shards.push({
      pts:[[a[0]-tx,a[1]-ty],[b[0]-tx,b[1]-ty],[c[0]-tx,c[1]-ty]],tx,ty,
      h:188+(tx+44)/88*112,            // циан → фиолетовый → маджента
      l:clamp(f.l+(rnd()-.5)*10,28,72),
      delay:rnd()*1900,dur:1400+rnd()*800,
      ang:rnd()*Math.PI*2,distF:.25+rnd()*.55,
      rot0:(rnd()<.5?-1:1)*(2+rnd()*4),swirl:(rnd()-.5)*90,
      ph:rnd()*6.28
    });
  };
  for(let i=0;i<N;i++)for(let j=0;j<N-i;j++){
    add(P(i,j),P(i+1,j),P(i,j+1));
    if(i+j<N-1)add(P(i+1,j),P(i,j+1),P(i+1,j+1));
  }
});
shards.forEach(s=>s.ta=s.delay+s.dur);
const TA=Math.max(...shards.map(s=>s.ta));   // момент, когда собран последний осколок
const T_WORD=TA+300;
const stars=Array.from({length:70},()=>({x:rnd(),y:rnd(),r:.4+rnd()*1.1,ph:rnd()*6.28}));
const outline=()=>{ctx.beginPath();ctx.moveTo(TOP[0],TOP[1]);ctx.lineTo(XS[3],YT);ctx.lineTo(XS[3],YB);ctx.lineTo(BOT[0],BOT[1]);ctx.lineTo(XS[0],YB);ctx.lineTo(XS[0],YT);ctx.closePath();};
const edges=()=>{
  outline();
  for(let i=1;i<3;i++){ctx.moveTo(TOP[0],TOP[1]);ctx.lineTo(XS[i],YT);ctx.lineTo(XS[i],YB);ctx.lineTo(BOT[0],BOT[1]);}
  ctx.moveTo(XS[0],YT);ctx.lineTo(XS[3],YT);ctx.moveTo(XS[0],YB);ctx.lineTo(XS[3],YB);
};

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const ch=Math.min(H*0.36,W*0.52,300);
  S=ch/224;cx=W/2;cy=H*0.40;
}
resize();window.addEventListener('resize',resize);

const tri=s=>{ctx.beginPath();ctx.moveTo(s.pts[0][0],s.pts[0][1]);ctx.lineTo(s.pts[1][0],s.pts[1][1]);ctx.lineTo(s.pts[2][0],s.pts[2][1]);ctx.closePath();};
function pos(s,e,t){
  const D=Math.max(W,H)/S*s.distF;
  const sx=Math.cos(s.ang)*D,sy=Math.sin(s.ang)*D;
  const nx=-Math.sin(s.ang),ny=Math.cos(s.ang),sw=s.swirl*(1-e)*e*4;
  const drift=(1-e)*Math.sin(t/600+s.ph)*5;
  return [s.tx+(sx)*(1-e)+nx*sw+drift,s.ty+(sy)*(1-e)+ny*sw+drift];
}

function render(t){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.shadowBlur=0;
  ctx.fillStyle='#030109';ctx.fillRect(0,0,W,H);
  const fadeIn=clamp(t/700);
  const arrived=shards.reduce((n,s)=>n+(t>=s.ta?1:0),0)/shards.length;
  const glow=clamp((t-TA)/700),pulse=.82+.18*Math.sin(t/380);
  const floatY=t>TA?Math.sin((t-TA)/650)*3.5:0;

  // звёзды
  ctx.fillStyle='#cdbbff';
  stars.forEach(s=>{ctx.globalAlpha=fadeIn*(.25+.45*Math.abs(Math.sin(t/900+s.ph)));ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,6.283);ctx.fill();});
  ctx.globalAlpha=1;

  // туманное свечение за кристаллом
  const R=Math.max(W,H)*.5*S/1.2+S*150,hz=(arrived*.35+glow*.65)*pulse;
  if(hz>0){const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R);
    g.addColorStop(0,'rgba(150,90,255,'+(.42*hz)+')');g.addColorStop(.45,'rgba(70,200,255,'+(.14*hz)+')');g.addColorStop(1,'rgba(20,5,60,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}

  ctx.save();ctx.translate(cx,cy+floatY*S);ctx.scale(S,S);

  // лучи после сборки
  if(glow>0){
    ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
    for(let i=0;i<10;i++){
      const a=i/10*6.283+t/4000,len=(120+(i%3)*45)*glow;
      ctx.strokeStyle='hsla('+(190+i*13)+',100%,70%,'+(.22*glow*pulse)+')';ctx.lineWidth=1.4;
      ctx.beginPath();ctx.moveTo(Math.cos(a)*40,Math.sin(a)*40);ctx.lineTo(Math.cos(a)*len*1.3,Math.sin(a)*len*1.3);ctx.stroke();
    }
    ctx.globalCompositeOperation='source-over';
  }

  // осколки
  ctx.lineJoin='round';
  shards.forEach(s=>{
    const p=clamp((t-s.delay)/s.dur),e=easeIO(p);
    const flash=t>=s.ta?clamp(1-(t-s.ta)/520):0;
    // шлейф в полёте
    if(p>0&&p<1){
      for(let k=1;k<=2;k++){
        const pp=clamp(p-k*.05),ee=easeIO(pp),q=pos(s,ee,t);
        ctx.save();ctx.translate(q[0],q[1]);ctx.rotate(s.rot0*(1-ee));ctx.scale(1+(1-ee)*.35,1+(1-ee)*.35);
        ctx.globalAlpha=fadeIn*(.22/k);ctx.fillStyle='hsl('+s.h+',100%,60%)';tri(s);ctx.fill();ctx.restore();
      }
    }
    const q=pos(s,e,t),sc=1+(1-e)*.35;
    ctx.save();ctx.translate(q[0],q[1]);ctx.rotate(s.rot0*(1-e));ctx.scale(sc,sc);
    ctx.globalAlpha=fadeIn;
    const L=Math.min(92,s.l+flash*34+(e<1?8:0));
    ctx.fillStyle='hsla('+s.h+',100%,'+L+'%,.94)';
    ctx.strokeStyle='hsla('+s.h+',100%,'+Math.min(90,L+26)+'%,'+(e<1?.95:.55)+')';
    ctx.lineWidth=e<1?1.1:.7;
    tri(s);ctx.fill();ctx.stroke();ctx.restore();
    // вспышка-искра в месте встречи
    if(t>=s.ta&&t-s.ta<460){
      const k=(t-s.ta)/460,len=4+10*(1-k)*1.2;
      ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=(1-k);ctx.strokeStyle='#e9fbff';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(s.tx-len,s.ty);ctx.lineTo(s.tx+len,s.ty);ctx.moveTo(s.tx,s.ty-len);ctx.lineTo(s.tx,s.ty+len);ctx.stroke();ctx.restore();
    }
  });
  ctx.globalAlpha=1;

  if(t>=TA){
    const dt=t-TA;
    // белая вспышка при сборке
    const f=clamp(1-dt/650);
    if(f>0){outline();ctx.fillStyle='rgba(255,255,255,'+(.9*f)+')';ctx.fill();}
    // бегущий блик по граням
    if(dt>700){
      const ph=((dt-700)%2800)/2800;
      if(ph<.55){
        ctx.save();outline();ctx.clip();
        const x=-130+ph/.55*260,g=ctx.createLinearGradient(x-26,-60,x+26,60);
        g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(255,255,255,0)');
        ctx.fillStyle=g;ctx.fillRect(-60,-120,120,240);ctx.restore();
      }
    }
    // неоновые рёбра
    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.shadowBlur=22*dpr;ctx.shadowColor='#ff3df0';
    ctx.strokeStyle='rgba(255,120,240,'+(.55*glow*pulse)+')';ctx.lineWidth=2.4;edges();ctx.stroke();
    ctx.shadowBlur=14*dpr;ctx.shadowColor='#37f0ff';
    ctx.strokeStyle='rgba(200,255,255,'+(.95*glow)+')';ctx.lineWidth=1.3;edges();ctx.stroke();
    ctx.shadowBlur=0;
    // ударная волна
    const r=clamp(dt/1000);
    if(r<1){ctx.globalCompositeOperation='lighter';ctx.strokeStyle='rgba(90,235,255,'+(.85*(1-r))+')';ctx.lineWidth=3*(1-r)+.4;
      ctx.beginPath();ctx.arc(0,0,40+r*300,0,6.283);ctx.stroke();ctx.globalCompositeOperation='source-over';}
  }
  ctx.restore();
}

const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduce){
  render(TA+1500);intro.classList.add('show');setTimeout(finish,2600);
}else{
  const t0=performance.now();
  const frame=now=>{
    if(done)return;
    const t=now-t0;render(t);
    if(t>=T_WORD&&!intro.classList.contains('show'))intro.classList.add('show');
    raf=requestAnimationFrame(frame);
  };
  raf=requestAnimationFrame(frame);
  setTimeout(finish,Math.round(T_WORD+4200));
}
})();
</script>
